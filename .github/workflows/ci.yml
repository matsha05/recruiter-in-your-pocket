name: CI

# Runs only when started by hand (Actions tab, "Run workflow").
#
# The checks themselves live in scripts/local-ci.cjs and normally run on a
# developer machine with `npm run local-ci`, which marks the commit on GitHub
# with a "local-ci" status. On November 4, 2026 GitHub stopped starting this
# repository's jobs ("recent account payments have failed or your spending
# limit needs to be increased"). A full run on every push billed about 29
# minutes against the free plan's 2,000 a month, so this stays manual and the
# minutes go to the scheduled jobs in this folder.
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            extension/package-lock.json

      - name: Local CI
        run: npm run local-ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
